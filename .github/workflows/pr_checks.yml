# =============================================================================
# RAGOps — PR Enforcement Workflow
# Runs on every PR to `develop` or `main`.
# All jobs must pass before merge is allowed.
#
# Jobs:
#   1. lint-and-type-check  — ruff + mypy
#   2. no-print-guard       — grep blocks print() in src/
#   3. unit-tests           — pytest with coverage gate (80%)
#   4. docker-build         — validates Dockerfile builds cleanly
#   5. ragas-ci-eval        — RAGAS quality gate (PRs to main/develop only)
# =============================================================================

name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop   # also runs on direct develop pushes (release PRs)

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true   # cancel superseded runs on force-push

jobs:

  # ── 1. Lint + Type Check ────────────────────────────────────────────────────
  lint-and-type-check:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docker/fastapi/requirements.txt

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r docker/fastapi/requirements.txt
          pip install ruff mypy

      - name: Ruff lint
        run: ruff check src/ mlops/ serving/ evaluation/ --output-format=github

      - name: Ruff format check
        run: ruff format src/ mlops/ serving/ evaluation/ --check

      - name: Mypy type check
        run: |
          mypy src/ mlops/ serving/ \
            --ignore-missing-imports \
            --strict \
            --exclude src/infra/test

  # ── 2. No print() guard ─────────────────────────────────────────────────────
  no-print-guard:
    name: No print() in src/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for print() statements
        run: |
          # Fail if any print( found outside test files
          if grep -rn "print(" src/ mlops/ serving/ \
              --include="*.py" \
              --exclude-dir="test" \
              --exclude-dir="tests" ; then
            echo ""
            echo "ERROR: print() statements found in src/mlops/serving/."
            echo "Use logging.getLogger(__name__).info/warning/error instead."
            exit 1
          fi
          echo "No print() statements found — OK"

  # ── 3. Unit Tests ───────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docker/fastapi/requirements.txt

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r docker/fastapi/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        run: |
          pytest src/ mlops/ tests/ \
            -m "not integration" \
            -v \
            --tb=short \
            --cov=src \
            --cov=mlops \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80
        env:
          # Point MLflow at a local SQLite DB for tests (matches test fixtures)
          MLFLOW_TRACKING_URI: sqlite:///test_mlflow.db
          ENVIRONMENT: test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ── 4. Docker Build ─────────────────────────────────────────────────────────
  docker-build:
    name: Docker build (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('docker/fastapi/Dockerfile', 'docker/fastapi/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Free disk space (Docker)
        run: |
          docker system prune -af --volumes || true
          df -h

      - name: Build FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/fastapi/Dockerfile
          push: false         # build only — no registry push on PRs
          tags: ragops/fastapi:pr-${{ github.event.pull_request.number }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=min
          build-args: |
            PYTHON_VERSION=3.11

      # Prevent cache from growing unboundedly
      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ── 5. RAGAS CI Quality Gate ────────────────────────────────────────────────
  # Runs end-to-end RAGAS evaluation against a 5-question CI stub using the
  # full docker-compose stack. Gated to PRs targeting main/develop to control
  # cost (Ollama model pull + LLM evals are expensive). Not triggered on
  # direct develop pushes.
  #
  # Thresholds are deliberately looser than production (settings.py 0.80/0.75)
  # to keep PR velocity high while still catching regressions.
  ragas-ci-eval:
    name: RAGAS quality gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check disk space after cleanup
        run: df -h

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docker/fastapi/requirements.txt

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r docker/fastapi/requirements.txt

      - name: Start docker-compose stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d chromadb mlflow ollama fastapi

      - name: Pull small LLM for CI
        run: docker compose exec -T ollama ollama pull llama3.2:1b

      - name: Wait for services healthy
        run: python scripts/healthcheck.py --timeout 180 --poll-interval 5

      - name: Run RAGAS CI evaluation + quality gate
        run: |
          python -c "
          from evaluation.ragas_runner import run_ci_eval
          import json, sys
          scores = run_ci_eval()
          print(json.dumps(scores, indent=2))
          ok = scores['faithfulness'] >= 0.70 and scores['context_recall'] >= 0.65
          sys.exit(0 if ok else 1)
          "

      - name: Upload MLflow DB + logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-ci-diagnostics
          path: |
            mlruns.db
            mlruns/
          retention-days: 7
          if-no-files-found: ignore

      - name: Dump FastAPI logs on failure
        if: failure()
        run: docker compose logs fastapi

      - name: Tear down stack
        if: always()
        run: docker compose down -v

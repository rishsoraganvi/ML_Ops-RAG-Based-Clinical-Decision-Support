services:
  ollama:
    # Force CPU mode on GitHub-hosted runners (no NVIDIA runtime)
    deploy: {}
    environment:
      OLLAMA_HOST: "0.0.0.0"
    # Optional: keep volumes consistent with your base compose if needed
    volumes:
      - ./ollama_data:/root/.ollama
      - ./docker/ollama/pull_model.sh:/pull_model.sh:ro